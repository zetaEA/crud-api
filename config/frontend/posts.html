<!DOCTYPE html>
<html>
<head>
    <title>SocialHub - Posts</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="header">
        <h1>📝 SocialHub - Посты</h1>
        <p>Делитесь идеями, общайтесь, вдохновляйтесь</p>
        <div class="nav">
            <a href="posts.html" style="background: rgba(255, 255, 255, 0.3);">💬 Посты</a>
            <a href="chat.html">💭 Чат</a>
            <button type="button" id="logoutBtn">🚪 Выход</button>
        </div>
    </div>

    <div class="container">
        <!-- Create Post Form -->
        <div class="form-box">
            <h3>✏️ Поделиться новой идеей</h3>
            <form id="postForm">
                <div class="form-group">
                    <label>Заголовок</label>
                    <input type="text" id="postTitle" placeholder="Назовите ваш пост..." required>
                </div>
                <div class="form-group">
                    <label>Содержание</label>
                    <textarea id="postContent" placeholder="Напишите что-нибудь интересное..." required></textarea>
                </div>
                <button type="submit" class="btn-primary">📤 Опубликовать</button>
            </form>
        </div>

        <!-- Posts Grid -->
        <h2 style="margin-bottom: 30px; color: var(--primary);">📚 Все посты</h2>
        <div class="posts-grid" id="postsList"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
